plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// GitHub Actions supplies these only while building an explicitly signed
// offline release. Never commit credentials or a keystore to this repository.
def forgeSigningFile = System.getenv("FORGE_ANDROID_SIGNING_KEYSTORE")
def forgeStorePassword = System.getenv("FORGE_ANDROID_STORE_PASSWORD")
def forgeKeyAlias = System.getenv("FORGE_ANDROID_KEY_ALIAS")
def forgeKeyPassword = System.getenv("FORGE_ANDROID_KEY_PASSWORD")
def forgeCanSign = forgeSigningFile && forgeStorePassword && forgeKeyAlias && forgeKeyPassword

android {
    namespace "ai.forgecore.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "ai.forgecore.mobile"
        minSdk 26
        targetSdk 35
        ndk { abiFilters 'arm64-v8a' }
        versionCode 8
        versionName "0.6.1-holographic-chat"
        manifestPlaceholders = [forgeAppLabel: "Forge Core"]
    }

    signingConfigs {
        release {
            if (forgeCanSign) {
                storeFile file(forgeSigningFile)
                storePassword forgeStorePassword
                keyAlias forgeKeyAlias
                keyPassword forgeKeyPassword
                storeType "jks"
            }
        }
    }

    buildTypes {
        debug {
            // Install the visual/voice preview beside existing Forge builds so
            // testing cannot overwrite or erase their encrypted local data.
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            manifestPlaceholders = [forgeAppLabel: "Forge Core Preview"]
        }
        release {
            manifestPlaceholders = [forgeAppLabel: "Forge Core"]
            if (forgeCanSign) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation project(":llamaAndroid")
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
