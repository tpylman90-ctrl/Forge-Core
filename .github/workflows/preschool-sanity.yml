name: Forge Seed v0.7 — QA memorization calibration

on:
  workflow_dispatch:
    inputs:
      research_run_id:
        type: string
        required: true
        description: "Original scratch Forge Seed v0.7 pretraining run"
        default: "41572257363"
      steps:
        type: number
        required: true
        default: 600
  push:
    branches: [main]
    paths: ["experiments/requests/preschool-qa-calibrate-001.md"]

permissions:
  contents: read
  actions: read

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN_ID: ${{ inputs.research_run_id || '41572257363' }}
      STEPS: ${{ github.event_name == 'push' && '600' || inputs.steps || '600' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Learnable BPE decoder
        run: python -m pip install "tokenizers>=0.20,<0.23"
      - name: Install Forge Core
        run: python -m pip install --no-deps -e .
      - name: Check bounded inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$STEPS" =~ ^[0-9]+$ ]]
          (( STEPS >= 1 && STEPS <= 2000 ))
      - name: Download verified original model, data and tokenizer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline results
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name forge-seed-v07-research --dir baseline
      - name: Memorize sixteen balanced training questions as a diagnostic
        shell: bash
        run: |
          python -m forge_core.neural.preschool_sanity \
            --checkpoint-dir baseline \
            --out results/calibration.json --steps "$STEPS"
      - name: Retain measurements, NOT promoted weights
        uses: actions/upload-artifact@v4
        with:
          name: forge-v07-qa-calibration
          path: results/
          retention-days: 30
          if-no-files-found: error
