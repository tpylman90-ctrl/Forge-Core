name: Forge Seed — balanced formal step-verifier pilot v4

on:
  workflow_dispatch:
    inputs:
      updates:
        description: "Supervised updates per arm and seed, 10–160"
        required: true
        type: number
        default: 100
      seeds:
        description: "Independent initialization seeds"
        required: true
        type: choice
        options: ["1", "2"]
        default: "2"
  push:
    branches: [main]
    paths:
      - "experiments/requests/rlvr-balanced-steps-v4-001.md"

concurrency:
  group: forge-rlvr-proof-pilot-cpu
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  train-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UPDATES: ${{ inputs.updates || '100' }}
      SEEDS: ${{ inputs.seeds || '2' }}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install public Forge research code
        run: python -m pip install --no-deps -e .
      - name: Verify balanced proof-step oracle and CPU caps
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UPDATES" =~ ^[0-9]+$ ]]
          [[ "$SEEDS" =~ ^[12]$ ]]
          (( UPDATES >= 10 && UPDATES <= 160 ))
          python -m unittest discover -s tests -p test_rlvr_step_verifier_v4.py -v
          python -m unittest discover -s tests -p test_rlvr_abstention_v3.py -v
      - name: Record runner and experiment start
        run: |
          mkdir -p results
          date -u '+%Y-%m-%dT%H:%M:%SZ' > results/start-time.txt
          getconf _NPROCESSORS_ONLN > results/logical-cpus.txt
      - name: Compare unweighted, balanced and reject-classified process supervision
        shell: bash
        run: |
          set -euo pipefail
          python -m forge_core.neural.rlvr_step_verifier_v4 \
            --out results --updates "$UPDATES" --seeds "$SEEDS"
      - name: Record experiment end
        if: always()
        run: date -u '+%Y-%m-%dT%H:%M:%SZ' > results/end-time.txt
      - name: Preserve research-only classifier checkpoints, metrics and proof traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-rlvr-v4-balanced-verifier-research
          path: results/
          if-no-files-found: warn
          retention-days: 30
