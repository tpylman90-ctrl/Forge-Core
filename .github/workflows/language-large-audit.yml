name: Forge larger independent language audit

on:
  push:
    branches: [main]
    paths: ["experiments/requests/language-large-audit-2026-11-09.md"]

permissions:
  contents: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evaluation dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "tokenizers>=0.20,<0.23"
          python -m pip install --no-deps -e .
      - name: Restore and verify archived parent, candidate, and data lineage
        run: |
          set -euo pipefail
          mkdir -p restore source artifacts/parent artifacts/candidate artifacts/evaluation
          gh run download 42552572467 --repo "$GITHUB_REPOSITORY" \
            --name forge-language-followup-107k-42552572467 --dir restore
          python - <<'PY'
          import hashlib, json, shutil, torch
          from pathlib import Path
          root=Path("restore")
          parent_paths=[p.parent for p in root.rglob("checkpoint.pt")
                        if p.parent.name=="parent" and (p.parent/"tokenizer.json").exists()]
          candidate_paths=[p.parent for p in root.rglob("checkpoint.pt")
                           if p.parent.name=="language"
                           and all((p.parent/n).exists() for n in
                                   ("tokenizer.json","source-manifest.json","train.txt","valid.txt","test.txt"))]
          if len(parent_paths)!=1 or len(candidate_paths)!=1:
              raise SystemExit(f"Unexpected archived checkpoint layout: parent={parent_paths}, candidate={candidate_paths}")
          parent_path=parent_paths[0]/"checkpoint.pt"
          candidate_path=candidate_paths[0]/"checkpoint.pt"
          expected_parent="ed2f1395b52c3ae2c674e00f3b86f82ec26685e2d1c631f6eb975ddb3f05fe0f"
          expected_candidate="848553a81549c1269c360c5d07c57adde92a7816a0bc19b61ecc8028c93fee99"
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest(parent_path)==expected_parent
          assert digest(candidate_path)==expected_candidate
          p=torch.load(parent_path,map_location="cpu",weights_only=True)
          c=torch.load(candidate_path,map_location="cpu",weights_only=True)
          assert p["step"]==107000 and c["step"]==107250
          manifest=json.loads((candidate_paths[0]/"source-manifest.json").read_text())
          assert manifest["revision"]=="f54c09fd23315a6f9c86f9dc80f725de7d8f9c64"
          assert manifest["license"]=="cdla-sharing-1.0"
          for split in ("train","valid","test"):
              assert digest(candidate_paths[0]/f"{split}.txt")==manifest[f"{split}_sha256"]
          assert digest(candidate_paths[0]/"tokenizer.json")=="4ecd7803d4c369e80bda2e74c30cfb769b7e3a942f931df83383eec9f794f04c"
          shutil.copytree(parent_paths[0],Path("artifacts/parent"),dirs_exist_ok=True)
          shutil.copytree(candidate_paths[0],Path("artifacts/candidate"),dirs_exist_ok=True)
          shutil.copytree(candidate_paths[0],Path("source"),dirs_exist_ok=True)
          print(json.dumps({"parent_sha256":digest(parent_path),"candidate_sha256":digest(candidate_path),
              "parent_step":p["step"],"candidate_step":c["step"],
              "previous_test_sha256":manifest["test_sha256"],
              "data_revision":manifest["revision"],"license":manifest["license"]},indent=2))
          PY
      - name: Evaluate on a fresh 16 MiB TinyStories slice
        run: |
          python -m forge_core.neural.fresh_language_large_eval \
            --source source --parent-dir artifacts/parent --candidate-dir artifacts/candidate \
            --out artifacts/evaluation --offset-mib 24 --range-mib 16 --windows 4096
      - name: Write lineage receipt for the evaluation
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          report=json.loads(Path("artifacts/evaluation/report.json").read_text())
          receipt={
            "evaluation_run":"${{ github.run_id }}",
            "parent_run":42539881351,"followup_run":42552572467,
            "parent_checkpoint_sha256":report["evaluation"]["parent"]["checkpoint_sha256"],
            "candidate_checkpoint_sha256":report["evaluation"]["candidate"]["checkpoint_sha256"],
            "test_range_sha256":report["dataset"]["raw_range_sha256"],
            "clean_test_sha256":report["dataset"]["new_test_sha256"],
            "report_sha256":hashlib.sha256(Path("artifacts/evaluation/report.json").read_bytes()).hexdigest(),
            "status":"evaluation_only_no_training"
          }
          Path("artifacts/evaluation/lineage.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forge-language-large-audit-${{ github.run_id }}
          path: artifacts/evaluation/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve evaluation and exact sample as a draft research release
        run: |
          set -euo pipefail
          tag="forge-language-large-audit-${GITHUB_RUN_ID}"
          tar -czf "${tag}.tar.gz" -C artifacts/evaluation .
          printf '%s\n' "Evaluation-only comparison of the verified 107k parent and selected 107250 Forge Seed checkpoint on a new 16 MiB raw TinyStories byte range beyond the previous 20–24 MiB test range. No training updates. Includes exact cleaned test sample, range and text hashes, manifest, report, and lineage receipt. Research-only; not comprehension certification or Android promotion." > notes.md
          gh release create "${tag}" "${tag}.tar.gz" --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease --title "Forge large language audit — run ${GITHUB_RUN_ID}" \
            --notes-file notes.md
