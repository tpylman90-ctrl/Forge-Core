name: Forge Seed — frozen pointer role-binding diagnostic

on:
  workflow_dispatch:
    inputs:
      original_run_id:
        description: Audited original Forge Seed scratch checkpoint
        type: string
        required: true
        default: "41572257363"
      parent_run_id:
        description: Source-verified compositional research candidate
        type: string
        required: true
        default: "41649770774"
      pointer_run_id:
        description: Frozen-backbone word-pointer experiment
        type: string
        required: true
        default: "41670001958"
  pull_request:
    paths:
      - ".github/workflows/role-binding-diagnostic.yml"
      - "src/forge_core/neural/role_binding_diagnostic.py"
      - "tests/test_role_binding_diagnostic.py"
  push:
    branches: [main]
    paths:
      - "experiments/requests/role-binding-diagnostic-001.md"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORIGINAL_RUN: ${{ inputs.original_run_id || '41572257363' }}
      PARENT_RUN: ${{ inputs.parent_run_id || '41649770774' }}
      POINTER_RUN: ${{ inputs.pointer_run_id || '41670001958' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install original scratch BPE tokenizer
        run: python -m pip install "tokenizers>=0.20,<0.23"
      - name: Install Forge Core
        run: python -m pip install --no-deps -e .
      - name: Test rule-oracle and paired questions
        run: python -m unittest discover -s tests -p test_role_binding_diagnostic.py -v
      - name: Restrict to previous verified experimental sources
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ORIGINAL_RUN" == "41572257363" ]]
          [[ "$PARENT_RUN" == "41649770774" ]]
          [[ "$POINTER_RUN" == "41670001958" ]]
      - name: Download frozen audited model and exact previous pointer weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original parent pointer results
          gh run download "$ORIGINAL_RUN" --repo "$GITHUB_REPOSITORY" \
            --name forge-seed-v07-research --dir original
          gh run download "$PARENT_RUN" --repo "$GITHUB_REPOSITORY" \
            --name forge-v07-compositional-qa --dir parent
          gh run download "$POINTER_RUN" --repo "$GITHUB_REPOSITORY" \
            --name forge-teacher-v1-neural-pointer --dir pointer
          test -f original/checkpoint.pt
          test -f original/source-manifest.json
          test -f parent/verified-research.pt
          test -f pointer/verified-pointer.pt
          test -f pointer/wrong-source-pointer.pt
      - name: Audit role reversals and question counterfactuals without gradients
        run: |
          python -m forge_core.neural.role_binding_diagnostic \
            --source original --parent parent --pointer pointer \
            --out results/role-binding-diagnostic.json
      - name: Archive research-only measurements, never promote weights
        uses: actions/upload-artifact@v4
        with:
          name: forge-pointer-role-binding-diagnostic
          path: results/role-binding-diagnostic.json
          if-no-files-found: error
          retention-days: 30
