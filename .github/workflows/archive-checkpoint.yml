name: Archive reviewed Forge Seed checkpoint (draft)

on:
  workflow_dispatch:
    inputs:
      training_run_id:
        description: "Successful public-data Forge Scratch Language Experiment run"
        required: true
        type: string
      release_tag:
        description: "Unique versioned release tag"
        required: true
        type: string
      confirmation:
        description: "Explicitly authorize a PUBLIC repository DRAFT checkpoint archive"
        required: true
        type: choice
        options:
          - do-not-archive
          - approve-draft-public-data-archive
        default: do-not-archive
  # Only an explicit, reviewed request file may launch an initial draft archive.
  push:
    branches: [main]
    paths: ["experiments/requests/archive-run003.md"]

permissions:
  contents: write
  actions: read

jobs:
  archive:
    if: github.event_name == 'push' || inputs.confirmation == 'approve-draft-public-data-archive'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN_ID: ${{ github.event_name == 'push' && '41556317228' || inputs.training_run_id }}
      RELEASE_TAG: ${{ github.event_name == 'push' && 'forge-seed-run003-v0.5' || inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CPU-only safe checkpoint decoder
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Forge Core research package
        run: python -m pip install --no-deps -e .
      - name: Check approved public-run arguments
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^forge-seed-[a-zA-Z0-9._-]+$ ]]
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; no overwrite permitted" >&2
            exit 1
          fi
      - name: Download and audit exact checkpoint and public data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name forge-scratch-language-checkpoint --dir archive
          python -m forge_core.neural.archive --folder archive
      - name: Create a DRAFT (not published) reproducible checkpoint archive
        shell: bash
        run: |
          set -euo pipefail
          cat > archive/RELEASE-NOTES.md <<EOF
          Forge Seed CPU research checkpoint from GitHub Actions run $RUN_ID.

          Original model initialized from random weights, trained on a small
          public TinyStories dataset-viewer preview (CDLA-Sharing-1.0).
          Audit data in archive-audit.json; read dataset-manifest.json and
          SOURCE-NOTICE.txt. Training text in archive is public sample data,
          not personal memory. This is not a capable conversation model.

          This GitHub release is initially a DRAFT and must be reviewed before
          publication. It may be used to restore an experiment but must not be
          treated as an audited long-term personal-memory store.
          EOF
          gh release create "$RELEASE_TAG" \
            archive/checkpoint.pt archive/metrics.json \
            archive/dataset-manifest.json archive/train.txt archive/valid.txt \
            archive/SOURCE-NOTICE.txt archive/archive-audit.json \
            --title "Forge Seed $RELEASE_TAG (research)" \
            --notes-file archive/RELEASE-NOTES.md --draft
