name: Forge ChatGPT adaptive tutor v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["experiments/requests/chatgpt-tutor-v2.md"]

permissions:
  contents: read
  actions: read

jobs:
  train:
    name: ${{ matrix.lane }} seed-${{ matrix.seed }} tutor v2
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - lane: language
            seed: 43
            independent_sampling: false
          - lane: language
            seed: 44
            independent_sampling: true
          - lane: blender
            seed: 731
            independent_sampling: false
          - lane: blender
            seed: 732
            independent_sampling: false
          - lane: godot
            seed: 947
            independent_sampling: false
          - lane: godot
            seed: 948
            independent_sampling: false
    env:
      SOURCE_RUN: "42552572467"
      SOURCE_ARTIFACT: "forge-language-followup-107k-42552572467"
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU training dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "tokenizers>=0.20,<0.23"
          python -m pip install --no-deps -e .
      - name: Restore and verify the pinned Forge Seed parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restore source
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" --dir restore
          cp -a restore/language/. source/
          python - <<'PY'
          import hashlib, json, torch
          from pathlib import Path
          p = Path("source/checkpoint.pt")
          ck = torch.load(p, map_location="cpu", weights_only=True)
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          assert ck["step"] == 107250 and ck.get("seed") == 43
          assert digest == "848553a81549c1269c360c5d07c57adde92a7816a0bc19b61ecc8028c93fee99"
          m = json.loads(Path("source/source-manifest.json").read_text())
          assert m["revision"] == "f54c09fd23315a6f9c86f9dc80f725de7d8f9c64"
          print({"step": ck["step"], "parent_sha256": digest,
                 "lane": "${{ matrix.lane }}", "seed": "${{ matrix.seed }}"})
          PY
      - name: Validate tutor and held-out transfer packs
        run: |
          python -m py_compile src/forge_core/neural/chatgpt_askwhy_v1.py
          python - <<'PY'
          from pathlib import Path
          for lane in ("language", "blender", "godot"):
              root = Path("data/chatgpt_teacher_v2") / lane
              train = (root / "why_train.txt").read_text(encoding="utf-8")
              exam = (root / "why_eval.txt").read_text(encoding="utf-8")
              assert len(train) > 1800 and len(exam) > 500
              for marker in ("Forge asks why", "Forge diagnoses", "ChatGPT explains",
                             "Faded retrieval", "Forge transfer", "Forge checks"):
                  assert marker in train, (lane, marker)
              assert "Independent held-out" in exam
              print(lane, "tutor-v2 and held-out transfer pack verified")
          PY
      - name: Train isolated tutor-v2 branch
        run: |
          args=(--lane "${{ matrix.lane }}" --arm chatgpt_tutor_v2 \
            --source source --out "artifacts/${{ matrix.lane }}/seed-${{ matrix.seed }}" \
            --seed "${{ matrix.seed }}" --updates 500)
          if [[ "${{ matrix.independent_sampling }}" == "true" ]]; then
            args+=(--independent-sampling)
          fi
          python -m forge_core.neural.chatgpt_askwhy_v1 "${args[@]}"
      - name: Preserve parent and reproducible teaching data
        if: always()
        run: |
          set -euo pipefail
          folder="artifacts/${{ matrix.lane }}/seed-${{ matrix.seed }}/parent"
          mkdir -p "$folder"
          cp source/checkpoint.pt source/tokenizer.json "$folder/"
          for file in train.txt eval.txt why_train.txt why_eval.txt; do
            cp "data/chatgpt_teacher_v1/${{ matrix.lane }}/$file" "$folder/"
          done
          for file in why_train.txt why_eval.txt; do
            cp "data/chatgpt_teacher_v2/${{ matrix.lane }}/$file" "$folder/tutor-v2-$file"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-tutor-v2-${{ matrix.lane }}-${{ matrix.seed }}-${{ github.run_id }}
          path: artifacts/${{ matrix.lane }}/seed-${{ matrix.seed }}/
          retention-days: 90
          if-no-files-found: warn

  summarize:
    name: Summarize repeated tutor-v2 runs
    needs: train
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: forge-tutor-v2-*-${{ github.run_id }}
          path: results
          merge-multiple: false
          if-no-files-found: ignore
      - name: Compare seeds and held-out lesson formats
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = []
          for path in sorted(Path("results").glob("**/metrics.json")):
              r = json.loads(path.read_text())
              s = r.get("chatgpt_askwhy_study", {})
              core = r.get("core_language_validation", {})
              rows.append((s.get("lane", r.get("lane")), s.get("seed"),
                           r.get("selected_updates"), s.get("tutor_v2_eval_improvement"),
                           s.get("direct_eval_improvement"), s.get("askwhy_eval_improvement"),
                           r.get("test_loss_parent"), r.get("test_loss_candidate"),
                           core.get("delta_candidate_minus_parent")))
          rows.sort()
          lines = [
              "# ChatGPT adaptive tutor v2",
              "",
              "Two seeds per lane start from the same pinned parent; candidate weights remain research-only.",
              "Positive lesson gain means lower held-out next-token loss. This is not a task-capability certification.",
              "",
              "| Lane | Seed | Selected updates | Tutor-v2 gain | Direct gain | Ask-Why v1 gain | Lane test parent → candidate | Shared-language Δ |",
              "|---|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for lane, seed, updates, v2, direct, why, before, after, core in rows:
              fmt = lambda x: "n/a" if x is None else f"{x:.5f}"
              test = "n/a" if before is None or after is None else f"{before:.5f} → {after:.5f}"
              lines.append(f"| {lane} | {seed} | {updates if updates is not None else 'n/a'} | {fmt(v2)} | {fmt(direct)} | {fmt(why)} | {test} | {fmt(core)} |")
          Path("tutor-v2-results.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-tutor-v2-results-${{ github.run_id }}
          path: tutor-v2-results.md
          retention-days: 90
          if-no-files-found: warn
