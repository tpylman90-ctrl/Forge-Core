name: Forge Seed — proof-action generator v5 (exact RLVR)

on:
  workflow_dispatch:
    inputs:
      updates:
        description: "Bounded optimizer updates per seed and arm (10–160)"
        type: number
        required: true
        default: 90
      seeds:
        description: "Independent policy initializations"
        type: choice
        options: ["1", "2"]
        required: true
        default: "2"
  push:
    branches: [main]
    paths:
      - "experiments/requests/rlvr-proof-generator-v5-001.md"

# One CPU runner for related RLVR studies; keep Android builds independent.
concurrency:
  group: forge-rlvr-proof-pilot-cpu
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  proof-action-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UPDATES: ${{ inputs.updates || '90' }}
      SEEDS: ${{ inputs.seeds || '2' }}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CPU-only original-neural training dependencies
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Forge Core research code
        run: python -m pip install --no-deps -e .
      - name: Verify strict budget and prove formal oracle soundness
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UPDATES" =~ ^[0-9]+$ ]]
          [[ "$SEEDS" =~ ^[12]$ ]]
          (( UPDATES >= 10 && UPDATES <= 160 ))
          python -m unittest discover -s tests -p test_rlvr_proof_generator_v5.py -v
      - name: Record runner metadata
        shell: bash
        run: |
          mkdir -p results
          date -u '+%Y-%m-%dT%H:%M:%SZ' > results/start-time-utc.txt
          getconf _NPROCESSORS_ONLN > results/logical-cpu-count.txt
      - name: Compare outcome RLVR, process rewards and exact step supervision
        shell: bash
        run: |
          set -euo pipefail
          python -m forge_core.neural.rlvr_proof_generator_v5 \
            --out results --updates "$UPDATES" --seeds "$SEEDS"
      - name: Preserve end timestamp
        if: always()
        shell: bash
        run: date -u '+%Y-%m-%dT%H:%M:%SZ' > results/end-time-utc.txt
      - name: Archive report and experimental-only checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-rlvr-proof-generator-v5-research
          path: results/
          if-no-files-found: warn
          retention-days: 30
