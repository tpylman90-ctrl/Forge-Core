name: Forge Seed — verifier-supervised RLVR actor pilot v2

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "One-off small CPU experiment steps per arm, 10–200"
        required: true
        type: number
        default: 120
  push:
    branches: [main]
    paths:
      - "experiments/requests/rlvr-process-distillation-v2-001.md"

concurrency:
  group: forge-rlvr-proof-pilot-cpu
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  train-and-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STEPS: ${{ inputs.steps || '120' }}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install public Forge research package
        run: python -m pip install --no-deps -e .
      - name: Validate genuine action and step-verifier tests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STEPS" =~ ^[0-9]+$ ]]
          (( STEPS >= 10 && STEPS <= 200 ))
          python -m unittest discover -s tests -p test_rlvr_process_v1.py -v
      - name: Capture start and runner metadata
        run: |
          mkdir -p results
          date -u '+%Y-%m-%dT%H:%M:%SZ' > results/start-time.txt
          getconf _NPROCESSORS_ONLN > results/available-cpus.txt
      - name: Execute verifier-to-actor distillation and on-policy proof learning
        run: |
          python -m forge_core.neural.rlvr_process_v1 \
            --seed 104 --steps "$STEPS" --out results
      - name: Capture end time
        if: always()
        run: date -u '+%Y-%m-%dT%H:%M:%SZ' > results/end-time.txt
      - name: Save research-only metrics and no model promotion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-rlvr-process-distillation-v2
          path: results/
          if-no-files-found: warn
          retention-days: 30
