name: Inspect Forge table reconstruction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-forge-table.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v5
        with:
          name: forge-cpu-polyhaven-45926268626
          run-id: 45926268626
          github-token: ${{ github.token }}
          path: checkpoints
      - name: Generate raw table geometry
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy trimesh pillow
          OMP_NUM_THREADS=2 python gpu-training/inspect_table.py checkpoints output
      - name: Render the actual voxel meshes in Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
          cat > /tmp/render-forge-table.py <<'PY'
          from pathlib import Path
          import bpy
          from mathutils import Vector

          for path in sorted(Path("output").resolve().glob("*.glb")):
              bpy.ops.wm.read_factory_settings(use_empty=True)
              bpy.ops.import_scene.gltf(filepath=str(path))
              bpy.ops.object.camera_add()
              camera = bpy.context.object
              camera.data.type = "ORTHO"
              camera.data.ortho_scale = 1.6
              scene = bpy.context.scene
              scene.camera = camera
              scene.render.engine = "BLENDER_WORKBENCH"
              scene.render.resolution_x = scene.render.resolution_y = 512
              scene.render.resolution_percentage = 100
              scene.display.shading.light = "STUDIO"
              scene.display.shading.color_type = "SINGLE"
              scene.display.shading.show_cavity = True
              for label, xyz in {
                  "front": (0, -3, 0), "side": (3, 0, 0),
                  "top": (0, 0, 3), "three-quarter": (2, -2.5, 1.7),
              }.items():
                  camera.location = xyz
                  camera.rotation_euler = (-Vector(xyz)).to_track_quat("-Z", "Y").to_euler()
                  scene.render.filepath = str(path.with_name(f"{path.stem}-{label}.png"))
                  bpy.ops.render.render(write_still=True)
              bpy.ops.wm.save_as_mainfile(filepath=str(path.with_suffix(".blend")))
          PY
          blender -b --factory-startup --python-exit-code 1 --python /tmp/render-forge-table.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: forge-table-inspection-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
