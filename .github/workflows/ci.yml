name: Forge Open 3D production CI

on:
  push:
    branches: [main]
    paths: ["production/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["production/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate request contract
        run: |
          python -m compileall -q production
          python -m unittest discover -s production -p 'test_*.py' -v
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1
          blender --version
      - name: Build textured cargo crate and render fixed views
        run: |
          blender --background --factory-startup --python-exit-code 1 --python production/build_blender.py -- --request production/requests/cargo_crate.json --out output/crate
      - name: Validate exported GLB
        run: python production/validate_glb.py output/crate
      - name: Package validated production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-cargo-crate-v1
          path: output/crate/
          retention-days: 30
          if-no-files-found: error
