name: Forge Core CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Forge Core
        run: python -m pip install --no-deps -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Tiny training smoke
        run: |
          mkdir -p data
          python -c "from pathlib import Path; Path('data/smoke.txt').write_text('Forge learns by testing ideas. ' * 12)"
          python -m forge_core.neural.train --text data/smoke.txt --model-size tiny --steps 2 --batch-size 2 --seq-len 16 --out artifacts/smoke.pt
