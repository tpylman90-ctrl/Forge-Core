name: Forge Seed v0.7 — independent single-step instruction audit

on:
  workflow_run:
    workflows: ["Forge Seed v0.7 — compositional short-answer generalization"]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Successful compositional Forge Seed research Actions run"
        type: string
        required: true
        default: "41649770774"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_RUN: "41572257363"
      CANDIDATE_RUN: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.candidate_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install trained-from-scratch BPE decoder
        run: python -m pip install "tokenizers>=0.20,<0.23"
      - name: Install Forge Core
        run: python -m pip install --no-deps -e .
      - name: Download source checkpoint and compositional experimental weights
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          mkdir -p source candidate results
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name forge-seed-v07-research --dir source
          gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name forge-v07-compositional-qa --dir candidate
      - name: Test fifty unseen direct one-step instructions
        shell: bash
        run: |
          python -m forge_core.neural.preschool_instructions \
            --checkpoint-dir source --candidate-dir candidate \
            --out results/instruction-audit.json
      - name: Preserve independent capability diagnostics (no promotion)
        uses: actions/upload-artifact@v4
        with:
          name: forge-v07-independent-instruction-audit
          path: results/
          retention-days: 30
          if-no-files-found: error
