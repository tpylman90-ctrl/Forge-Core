name: Forge Seed v0.7 — paired giver/recipient counterfactual

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful public-only wide-corpus scratch pretraining run"
        type: string
        required: true
        default: "42085634121"
      seed:
        description: "Deterministic curriculum seed"
        type: number
        required: true
        default: 1811
  push:
    branches: [main]
    paths: ["experiments/requests/role-counterfactual-v1.md"]

permissions:
  contents: read
  actions: read

jobs:
  role-counterfactual:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_RUN: \${{ github.event_name == 'push' && '42085634121' || inputs.source_run_id || '42085634121' }}
      SEED: \${{ github.event_name == 'push' && '1811' || inputs.seed || '1811' }}
      GH_TOKEN: \${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install the scratch-trained BPE tokenizer
        run: python -m pip install "tokenizers>=0.20,<0.23"
      - name: Install Forge Core
        run: python -m pip install --no-deps -e .
      - name: Validate bounded run identifiers
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$SEED" =~ ^[0-9]+$ ]]
          (( SOURCE_RUN == 42085634121 ))
          (( SEED >= 1 && SEED <= 1000000 ))
      - name: Restore exact scratch-trained checkpoint and public source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source artifacts/role-counterfactual
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name forge-seed-v07-research --dir source
          for file in checkpoint.pt tokenizer.json source-manifest.json train.txt valid.txt; do
            test -f "source/$file"
          done
      - name: Check tests and run the direct-answer counterfactual curriculum
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_role_counterfactual_v1.py' -v
          python -m forge_core.neural.role_counterfactual_v1 \
            --checkpoint-dir source --out artifacts/role-counterfactual \
            --source-run "$SOURCE_RUN" --seed "$SEED"
      - name: Preserve metrics and research-only candidate weights
        uses: actions/upload-artifact@v4
        with:
          name: forge-role-counterfactual-v1
          path: artifacts/role-counterfactual/
          retention-days: 90
          if-no-files-found: error
