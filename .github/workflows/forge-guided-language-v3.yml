name: Forge language guided progressive micro-runs v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["experiments/requests/guided-language-v3-2026-11-13.md", "experiments/requests/guided-language-v3-retry-2026-11-13.md"]

permissions:
  contents: write
  actions: read

env:
  LANE: "language"
  SOURCE_RUN: "42552572467"
  SOURCE_ARTIFACT: "forge-language-followup-107k-42552572467"
  PYTHONUNBUFFERED: "1"

jobs:
  prepare-source:
    name: Pin Forge parent and language data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "tokenizers>=0.20,<0.23"
          python -m pip install --no-deps -e .
      - name: Restore and verify exact selected parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p restore source
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir restore
          python - <<'PY'
          import hashlib, json, shutil, torch
          from pathlib import Path
          root=Path("restore/language"); ck=root/"checkpoint.pt"
          state=torch.load(ck,map_location="cpu",weights_only=True)
          assert state['step']==107250 and state.get('seed')==43
          assert hashlib.sha256(ck.read_bytes()).hexdigest()=='848553a81549c1269c360c5d07c57adde92a7816a0bc19b61ecc8028c93fee99'
          m=json.loads((root/"source-manifest.json").read_text())
          assert m['revision']=='f54c09fd23315a6f9c86f9dc80f725de7d8f9c64' and m['license']=='cdla-sharing-1.0'
          for n in ('tokenizer.json','source-manifest.json','train.txt','valid.txt','test.txt','ATTRIBUTION.txt'): shutil.copy2(root/n,Path('source')/n)
          assert hashlib.sha256((root/'tokenizer.json').read_bytes()).hexdigest()=='4ecd7803d4c369e80bda2e74c30cfb769b7e3a942f931df83383eec9f794f04c'
          shutil.copy2(ck,Path('source/checkpoint.pt')); print('verified parent',state['step'])
          PY
      - name: Pin and license-check language documentation
        if: env.LANE != 'language'
        run: |
          python -c "from pathlib import Path; from forge_core.neural.multilane_v2 import fetch_manual; print(fetch_manual('$LANE',Path('source/manual')))"
      - uses: actions/upload-artifact@v4
        with:
          name: forge-guided-source-${{ github.run_id }}
          path: source/
          retention-days: 90
          if-no-files-found: error

  micro-runs:
    name: language curriculum seed ${{ matrix.seed }}
    needs: prepare-source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [43, 53, 73]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "tokenizers>=0.20,<0.23"
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v4
        with:
          name: forge-guided-source-${{ github.run_id }}
          path: source
      - name: Validate trainer and input lineage
        run: |
          python -m py_compile src/forge_core/neural/guided_curriculum_v3.py
          python -c "import hashlib; from pathlib import Path; assert hashlib.sha256(Path('source/checkpoint.pt').read_bytes()).hexdigest()=='848553a81549c1269c360c5d07c57adde92a7816a0bc19b61ecc8028c93fee99'"
      - name: Run progressive stages with validation every 100 updates
        run: |
          python -m forge_core.neural.guided_curriculum_v3 --lane "$LANE" --source source --out "artifacts/seed-${{ matrix.seed }}" --seed "${{ matrix.seed }}" --stage-updates 500 --eval-every 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-guided-v3-language-seed${{ matrix.seed }}-${{ github.run_id }}
          path: artifacts/seed-${{ matrix.seed }}/
          retention-days: 90
          if-no-files-found: warn
  summarize:
    name: Compare language seeds and archive the research result
    needs: [prepare-source, micro-runs]
    if: always() && needs.prepare-source.result == 'success' && needs.micro-runs.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: forge-guided-source-${{ github.run_id }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          pattern: forge-guided-v3-language-seed*-${{ github.run_id }}
          path: results
      - name: Compare the three fixed-seed reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("results").glob("**/metrics.json"))
          if len(files) != 3:
              raise SystemExit(f"Expected 3 seed reports, got {len(files)}")
          rows = sorted((json.loads(p.read_text()) for p in files), key=lambda x: x["seed"])
          lines = [
              "# Forge language guided curriculum v3",
              "",
              "Three seeds; 25% → 60% → 100% progressive content stages; 500 updates per stage;",
              "fixed validation every 100 updates. The held-out test split did not select weights.",
              "",
              "| Seed | Updates | Val parent → candidate | Test parent → candidate | Core language Δ | Guard | Stop |",
              "|---:|---:|---:|---:|---:|:---:|---|",
          ]
          for r in rows:
              lines.append(
                  f'| {r["seed"]} | {r["updates"]} | {r["domain_validation_loss_parent"]:.4f} → '
                  f'{r["domain_validation_loss_candidate"]:.4f} | {r["domain_test_loss_parent"]:.4f} → '
                  f'{r["domain_test_loss_candidate"]:.4f} | {r["core_language_delta_candidate_minus_parent"]:+.4f} | '
                  f'{"pass" if r["core_language_guard_passed"] else "fail"} | {r["stop_reason"]} |'
              )
          lines += ["", "Lower loss means better next-token prediction on this fixed split. It does not establish language understanding or Blender/Godot application competence."]
          Path("summary.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forge-guided-v3-language-summary-${{ github.run_id }}
          path: summary.md
          retention-days: 90
      - name: Create draft archive for the three isolated candidates
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: "language"
        run: |
          set -euo pipefail
          tag="forge-guided-v3-${LANE}-${GITHUB_RUN_ID}"
          mkdir -p "release/${tag}/parent"
          cp source/checkpoint.pt source/tokenizer.json source/source-manifest.json \
             source/train.txt source/valid.txt source/test.txt source/ATTRIBUTION.txt \
             "release/${tag}/parent/"
          if [[ -d source/manual ]]; then cp -R source/manual "release/${tag}/parent/"; fi
          cp summary.md "release/${tag}/"
          cp -R results "release/${tag}/"
          tar -czf "release/${tag}.tar.gz" -C release "${tag}"
          cat > release-notes.md <<EOF
          Three-seed isolated language curriculum research. Each candidate retains
          the verified Forge Seed parent lineage. These are draft research artifacts;
          no weights are merged, promoted to Android, or claimed as application-ready.
          EOF
          gh release create "${tag}" "release/${tag}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --title "Forge guided language micro-runs ${GITHUB_RUN_ID}" \
            --notes-file release-notes.md
