name: Forge Seed v0.7 — core language continuation

on:
  workflow_dispatch:
    inputs:
      steps:
        type: number
        description: "Bounded additional updates, 1–10000"
        required: true
        default: 8000
      parent_run_id:
        type: string
        description: "Successful core-continuation run containing the checkpoint to resume"
        required: false
        default: "42118418883"
  push:
    branches: [main]
    paths: ["experiments/requests/core-language-continuation-004.md"]

permissions:
  contents: read
  actions: read

jobs:
  continue-language-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_RUN: ${{ inputs.parent_run_id || '42118418883' }}
      STEPS: ${{ github.event_name == 'push' && '8000' || inputs.steps || '8000' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install original BPE tokenizer implementation
        run: python -m pip install "tokenizers>=0.20,<0.23"
      - name: Install Forge Core
        run: python -m pip install --no-deps -e .
      - name: Validate bounded continuation settings
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STEPS" =~ ^[0-9]+$ ]]
          (( STEPS >= 1 && STEPS <= 10000 ))
      - name: Restore the exact approved training checkpoint and data split
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name forge-seed-v07-continuation --dir source
          for file in checkpoint.pt tokenizer.json source-manifest.json train.txt valid.txt; do
            test -f "source/$file"
          done
          cp source/source-manifest.json source/manifest.json
      - name: Verify parent checkpoint and immutable data lineage
        run: |
          python - <<'PY'
          import hashlib, json, torch
          from pathlib import Path
          root = Path("source")
          manifest = json.loads((root / "manifest.json").read_text())
          ckpt = torch.load(root / "checkpoint.pt", map_location="cpu", weights_only=True)
          assert manifest["revision"] == "f54c09fd23315a6f9c86f9dc80f725de7d8f9c64"
          assert manifest["license"] == "cdla-sharing-1.0"
          assert ckpt["step"] >= 28000 and ckpt["seed"] == 43
          assert ckpt["lr"] == 0.0003 and ckpt["batch"] == 4 and ckpt["seq_len"] == 128
          for split in ("train", "valid"):
              digest = hashlib.sha256((root / f"{split}.txt").read_bytes()).hexdigest()
              assert digest == manifest[f"{split}_sha256"] == ckpt[f"{split}_sha256"]
          print(json.dumps({
              "parent_run": int(__import__("os").environ["SOURCE_RUN"]), "parent_step": ckpt["step"],
              "seed": ckpt["seed"], "train_sha256": ckpt["train_sha256"],
              "valid_sha256": ckpt["valid_sha256"],
              "tokenizer_sha256": ckpt["tokenizer_sha256"],
              "revision": ckpt["revision"], "verified": True
          }, indent=2))
          PY
      - name: Continue Forge's original language model from its saved optimizer state
        run: |
          set -euo pipefail
          python -m forge_core.neural.seed_v07 \
            --source source --out artifacts/preschool \
            --model-size seed --steps "$STEPS" --batch 4 --seq-len 128 \
            --vocab 2048 --eval-every 1000 --seed 43 \
            --resume source/checkpoint.pt
      - name: Evaluate the continued checkpoint and preserve parent lineage
        shell: bash
        run: |
          set -euo pipefail
          cp source/checkpoint.pt artifacts/preschool/parent-checkpoint.pt
          cp source/source-manifest.json artifacts/preschool/source-manifest.json
          cp source/train.txt artifacts/preschool/train.txt
          cp source/valid.txt artifacts/preschool/valid.txt
          python -m forge_core.neural.preschool_eval \
            --checkpoint-dir artifacts/preschool \
            --out artifacts/preschool/capabilities.json
          python - <<'PY'
          import hashlib, json, torch
          from pathlib import Path
          source = Path("source/checkpoint.pt").read_bytes()
          candidate = Path("artifacts/preschool/checkpoint.pt").read_bytes()
          info = {
              "kind": "continued_core_language_checkpoint",
              "status": "research_candidate_not_promoted",
              "parent_run": int(__import__("os").environ["SOURCE_RUN"]),
              "parent_step": torch.load("source/checkpoint.pt", map_location="cpu", weights_only=True)["step"],
              "candidate_sha256": hashlib.sha256(candidate).hexdigest(),
              "parent_sha256": hashlib.sha256(source).hexdigest(),
              "additional_steps": int(__import__("os").environ["STEPS"]),
              "total_steps": torch.load("source/checkpoint.pt", map_location="cpu", weights_only=True)["step"] + int(__import__("os").environ["STEPS"]),
              "source_data_reused_exactly": True,
              "optimizer_state_resumed": True,
              "android_integrated": False
          }
          Path("artifacts/preschool/lineage.json").write_text(json.dumps(info, indent=2) + "\n")
          PY
      - name: Preserve continued checkpoint and reproducibility materials
        uses: actions/upload-artifact@v4
        with:
          name: forge-seed-v07-continuation
          path: artifacts/preschool/
          retention-days: 90
          if-no-files-found: error
