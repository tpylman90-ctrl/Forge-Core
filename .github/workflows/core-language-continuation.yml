name: Forge Seed v0.7 — adaptive core language continuation

on:
  workflow_dispatch:
    inputs:
      steps:
        type: number
        description: "Bounded additional update attempts, 1–10000"
        required: true
        default: 8000
      parent_run_id:
        type: string
        description: "Successful core-continuation run containing the exact checkpoint to resume"
        required: false
        default: "42138215923"
  push:
    branches: [main]
    paths: ["experiments/requests/core-language-continuation-006.md"]

permissions:
  contents: write
  actions: read

jobs:
  continue-language-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_RUN: ${{ github.event_name == 'push' && '42138215923' || inputs.parent_run_id || '42138215923' }}
      STEPS: ${{ github.event_name == 'push' && '8000' || inputs.steps || '8000' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install original BPE tokenizer implementation
        run: python -m pip install "tokenizers>=0.20,<0.23"
      - name: Install Forge Core
        run: python -m pip install --no-deps -e .
      - name: Validate bounded continuation settings
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STEPS" =~ ^[0-9]+$ ]]
          (( STEPS >= 1 && STEPS <= 10000 ))
      - name: Restore the exact approved training checkpoint and data split
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name forge-seed-v07-continuation --dir source
          for file in checkpoint.pt tokenizer.json source-manifest.json train.txt valid.txt; do
            test -f "source/$file"
          done
          cp source/source-manifest.json source/manifest.json
      - name: Verify parent checkpoint and immutable data lineage
        run: |
          python - <<'PY'
          import hashlib, json, os, torch
          from pathlib import Path
          root = Path("source")
          manifest = json.loads((root / "manifest.json").read_text())
          ckpt = torch.load(root / "checkpoint.pt", map_location="cpu", weights_only=True)
          assert manifest["revision"] == "f54c09fd23315a6f9c86f9dc80f725de7d8f9c64"
          assert manifest["license"] == "cdla-sharing-1.0"
          assert ckpt["step"] >= 28000 and ckpt["seed"] == 43
          assert ckpt["lr"] == 0.0003 and ckpt["batch"] == 4 and ckpt["seq_len"] == 128
          for split in ("train", "valid"):
              digest = hashlib.sha256((root / f"{split}.txt").read_bytes()).hexdigest()
              assert digest == manifest[f"{split}_sha256"] == ckpt[f"{split}_sha256"]
          print(json.dumps({
              "parent_run": int(os.environ["SOURCE_RUN"]), "parent_step": ckpt["step"],
              "seed": ckpt["seed"], "train_sha256": ckpt["train_sha256"],
              "valid_sha256": ckpt["valid_sha256"],
              "tokenizer_sha256": ckpt["tokenizer_sha256"],
              "revision": ckpt["revision"], "verified": True
          }, indent=2))
          PY
      - name: Train with frequent checkpoints and automatic regression recovery
        run: |
          set -euo pipefail
          python -m forge_core.neural.seed_v08_adaptive \
            --source source --out artifacts/preschool \
            --steps "$STEPS" --batch 4 --seq-len 128 --seed 43 \
            --lr 0.0003 --eval-every 250 \
            --regression-threshold 0.01 --regression-patience 2 \
            --lr-floor 0.00001
      - name: Compare best candidate with parent on matched 2,048 validation windows
        run: |
          python - <<'PY'
          import hashlib, json, torch
          from pathlib import Path
          from tokenizers import Tokenizer
          from forge_core.neural.model import ByteTransformer, ModelConfig
          from forge_core.neural.seed_v07 import heldout
          source, candidate = Path("source"), Path("artifacts/preschool")
          parent_ckpt = torch.load(source / "checkpoint.pt", map_location="cpu", weights_only=True)
          candidate_ckpt = torch.load(candidate / "checkpoint.pt", map_location="cpu", weights_only=True)
          assert hashlib.sha256((source / "tokenizer.json").read_bytes()).hexdigest() == parent_ckpt["tokenizer_sha256"]
          assert hashlib.sha256((candidate / "tokenizer.json").read_bytes()).hexdigest() == candidate_ckpt["tokenizer_sha256"]
          assert parent_ckpt["tokenizer_sha256"] == candidate_ckpt["tokenizer_sha256"]
          assert parent_ckpt["valid_sha256"] == candidate_ckpt["valid_sha256"]
          tokens = torch.tensor(Tokenizer.from_file(str(source / "tokenizer.json")).encode((source / "valid.txt").read_text()).ids, dtype=torch.long)
          scores = {}
          for name, ckpt in (("parent", parent_ckpt), ("candidate", candidate_ckpt)):
              model = ByteTransformer(ModelConfig(**ckpt["configuration"]))
              model.load_state_dict(ckpt["model"])
              scores[name] = heldout(model, tokens, windows=2048, seq_len=128)
          delta = scores["candidate"] - scores["parent"]
          result = {
              "schema": 1,
              "method": "same tokenizer and validation split; 2,048 evenly spaced 128-token windows",
              "parent_step": parent_ckpt["step"],
              "candidate_step": candidate_ckpt["step"],
              "parent_token_loss": round(scores["parent"], 8),
              "candidate_token_loss": round(scores["candidate"], 8),
              "delta_candidate_minus_parent": round(delta, 8),
              "lower_is_better": True,
              "gate": "candidate passes only when matched loss is no worse than parent",
              "passed": delta <= 0,
              "interpretation": "Matched text-prediction diagnostic only; not evidence of general comprehension or reasoning."
          }
          Path("artifacts/preschool/matched-heldout-2048.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          PY
      - name: Evaluate capabilities and preserve parent lineage
        shell: bash
        run: |
          set -euo pipefail
          cp source/checkpoint.pt artifacts/preschool/parent-checkpoint.pt
          cp source/source-manifest.json artifacts/preschool/source-manifest.json
          cp source/train.txt artifacts/preschool/train.txt
          cp source/valid.txt artifacts/preschool/valid.txt
          python -m forge_core.neural.preschool_eval \
            --checkpoint-dir artifacts/preschool \
            --out artifacts/preschool/capabilities.json
          python - <<'PY'
          import hashlib, json, os, torch
          from pathlib import Path
          source = Path("source/checkpoint.pt").read_bytes()
          candidate = Path("artifacts/preschool/checkpoint.pt").read_bytes()
          metrics = json.loads(Path("artifacts/preschool/metrics.json").read_text())
          info = {
              "kind": "continued_core_language_checkpoint",
              "status": "research_candidate_not_promoted",
              "parent_run": int(os.environ["SOURCE_RUN"]),
              "parent_sha256": hashlib.sha256(source).hexdigest(),
              "candidate_sha256": hashlib.sha256(candidate).hexdigest(),
              "parent_step": metrics["parent_step"],
              "candidate_step": metrics["steps_total"],
              "training_updates_attempted": metrics["training_updates_attempted"],
              "checkpoint_interval_updates": metrics["checkpoint_interval_updates"],
              "recovery_events": metrics["recovery_events"],
              "source_data_reused_exactly": True,
              "optimizer_state_resumed": True,
              "android_integrated": False
          }
          Path("artifacts/preschool/lineage.json").write_text(json.dumps(info, indent=2) + "\n")
          PY
      - name: Preserve frequent checkpoints and reproducibility materials
        uses: actions/upload-artifact@v4
        with:
          name: forge-seed-v07-continuation
          path: artifacts/preschool/
          retention-days: 90
          if-no-files-found: error
      - name: Block durable draft creation when matched evaluation regresses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("artifacts/preschool/matched-heldout-2048.json").read_text())
          if not result["passed"]:
              raise SystemExit("Candidate regressed; artifact is preserved, durable draft is blocked.")
          PY
      - name: Build a durable research checkpoint bundle
        shell: bash
        run: |
          set -euo pipefail
          TOTAL_STEPS="$(python -c 'import json; print(json.load(open("artifacts/preschool/metrics.json"))["steps_total"])')"
          mkdir -p release
          tar -czf "release/forge-seed-v07-step-${TOTAL_STEPS}.tar.gz" \
            -C artifacts/preschool checkpoint.pt best.pt latest.pt parent-checkpoint.pt \
            tokenizer.json source-manifest.json train.txt valid.txt \
            metrics.json capabilities.json lineage.json matched-heldout-2048.json
          echo "TOTAL_STEPS=$TOTAL_STEPS" >> "$GITHUB_ENV"
      - name: Preserve the candidate as an unpublished draft release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Unpublished Forge Seed v0.7 adaptive research checkpoint at ${TOTAL_STEPS}
          best optimizer updates. It includes the exact parent, best and latest
          periodic checkpoints, optimizer and RNG states, the public data split,
          matched evaluation, recovery log and lineage.

          Regression recovery rolls back after two consecutive 1% validation
          regressions and halves learning rate down to 0.00001. The fixed matched
          2,048-window comparison must pass. No candidate is promoted to Android.
          EOF
          gh release create "forge-seed-v07-step-${TOTAL_STEPS}" \
            "release/forge-seed-v07-step-${TOTAL_STEPS}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --title "Forge Seed v0.7 — ${TOTAL_STEPS}-step research checkpoint" \
            --notes-file release-notes.md
