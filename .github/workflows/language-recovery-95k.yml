name: Forge verified-parent language recovery

on:
  push:
    branches: [main]
    paths: ["experiments/requests/language-recovery-95k-2026-11-06.md"]

permissions:
  contents: write
  actions: read

jobs:
  continue-language:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SOURCE_RUN: "42143390701"
      DURATION_SECONDS: "3600"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU training dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "tokenizers>=0.20,<0.23"
          python -m pip install --no-deps -e .
      - name: Restore and verify the exact 95k parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name forge-seed-v07-continuation --dir source
          python - <<'PY'
          import hashlib, torch
          from pathlib import Path
          p = Path("source/checkpoint.pt")
          ckpt = torch.load(p, map_location="cpu", weights_only=True)
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          assert ckpt["step"] == 95000
          assert digest == "a7bcdb996e440f44d7496b887b54d19324927b4296fe9ed2f0f0293c88c63a0a"
          print({"parent_step": ckpt["step"], "parent_sha256": digest})
          PY
      - name: Continue only the core language lane with its saved optimizer and RNG
        run: |
          python -m forge_core.neural.multilane_v1 \
            --lane language --source source --out artifacts/language \
            --seconds "$DURATION_SECONDS"
      - name: Upload the reproducible language candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-language-recovery-95k-${{ github.run_id }}
          path: artifacts/language/
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve the research checkpoint as a draft release
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          tag="forge-language-recovery-95k-${GITHUB_RUN_ID}"
          files=(checkpoint.pt lineage.json metrics.json source-manifest.json tokenizer.json train.txt valid.txt test.txt ATTRIBUTION.txt capabilities.json task-samples.json)
          tar -czf "artifacts/${tag}.tar.gz" -C artifacts/language "${files[@]}"
          cat > artifacts/release-notes.md <<EOF
          One-hour uniform language continuation from the verified 95k parent.
          Uses the independent pinned TinyStories test range and keeps the result
          research-only. The 152k candidate audit did not beat its parent on
          untouched test data. No weights are promoted or integrated into Android.
          EOF
          gh release create "$tag" "artifacts/${tag}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --title "Forge language recovery from 95k — run ${GITHUB_RUN_ID}" \
            --notes-file artifacts/release-notes.md
