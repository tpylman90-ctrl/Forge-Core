name: Forge Core Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify preinstalled Android SDK and install platform
        run: |
          test -d "$ANDROID_HOME/cmdline-tools"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compile debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Publish development debug APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-core-first-breath-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Keep signing material unavailable to pull requests.
      - name: Check release signing configuration
        id: signing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FORGE_ANDROID_KEYSTORE_B64: ${{ secrets.FORGE_ANDROID_KEYSTORE_B64 }}
          FORGE_ANDROID_STORE_PASSWORD: ${{ secrets.FORGE_ANDROID_STORE_PASSWORD }}
          FORGE_ANDROID_KEY_ALIAS: ${{ secrets.FORGE_ANDROID_KEY_ALIAS }}
          FORGE_ANDROID_KEY_PASSWORD: ${{ secrets.FORGE_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FORGE_ANDROID_KEYSTORE_B64" && -z "$FORGE_ANDROID_STORE_PASSWORD" &&
                -z "$FORGE_ANDROID_KEY_ALIAS" && -z "$FORGE_ANDROID_KEY_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not yet configured; debug build only."
          elif [[ -z "$FORGE_ANDROID_KEYSTORE_B64" || -z "$FORGE_ANDROID_STORE_PASSWORD" ||
                  -z "$FORGE_ANDROID_KEY_ALIAS" || -z "$FORGE_ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Release signing needs all four FORGE_ANDROID_* GitHub Actions secrets."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble and verify permanently signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          FORGE_ANDROID_KEYSTORE_B64: ${{ secrets.FORGE_ANDROID_KEYSTORE_B64 }}
          FORGE_ANDROID_STORE_PASSWORD: ${{ secrets.FORGE_ANDROID_STORE_PASSWORD }}
          FORGE_ANDROID_KEY_ALIAS: ${{ secrets.FORGE_ANDROID_KEY_ALIAS }}
          FORGE_ANDROID_KEY_PASSWORD: ${{ secrets.FORGE_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE="$RUNNER_TEMP/forge-core-release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$FORGE_ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          export FORGE_ANDROID_SIGNING_KEYSTORE="$KEYSTORE"
          gradle -p android :app:assembleRelease --no-daemon --stacktrace
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Publish signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: forge-core-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
