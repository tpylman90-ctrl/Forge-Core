name: Archive Forge best-lane follow-up
on:
  push:
    branches: [main]
    paths: ["experiments/requests/archive-best-lane-42480865448.md"]
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download completed training artifacts
        run: |
          mkdir -p bundle
          gh run download 42480865448 --repo "$GITHUB_REPOSITORY" --dir bundle
      - name: Build comparison report
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[]
          for path in sorted(glob.glob("bundle/**/candidate/metrics.json",recursive=True)):
              m=json.load(open(path,encoding="utf-8"))
              lane="language" if "/language-" in path else m.get("lane")
              if not lane: raise SystemExit(f"Cannot determine lane from {path}")
              base=os.path.dirname(os.path.dirname(path)); ev={}
              for role in ("parent","candidate"):
                  p=os.path.join(base,role,"fresh-evaluation.json")
                  if os.path.exists(p):
                      e=json.load(open(p,encoding="utf-8"))
                      ev[role]=(e.get("fresh_document_loss"),e.get("capability_probe",{}).get("correct"),e.get("capability_probe",{}).get("total"))
              rows.append((lane,m,ev))
          if len(rows)!=3: raise SystemExit(f"Expected three lane reports, found {len(rows)}")
          with open("bundle/BEST-LANE-CONTINUATION-2026-11-08.md","w",encoding="utf-8") as f:
              f.write("# Forge best-lane continuation — 2026-11-08\n\n")
              f.write("Research-only. Each lane resumed its verified parent and optimizer/RNG state; lane weights remained isolated. Token loss and forced-choice probes do not establish practical competence. No Android integration or promotion.\n\n")
              f.write("| Lane | Updates | Validation parent → selected | Test parent → selected | Fresh docs loss parent → candidate | Fresh task correct parent → candidate | Candidate SHA-256 |\n|---|---:|---:|---:|---:|---:|---|\n")
              for lane,m,ev in rows:
                  if lane=="language":
                      vals=(m["actual_updates_completed"],m["parent_validation_loss_2048"],m["selected_validation_loss_2048"],m["parent_independent_test_loss_2048"],m["selected_independent_test_loss_2048"],"TinyStories fresh capability reports attached","see capability reports",m["selected_checkpoint_sha256"])
                  else:
                      vals=(m["updates_this_run"],m["parent_validation_loss"],m["selected_validation_loss"],m["parent_test_loss"],m["selected_test_loss"],f"{ev.get('parent',(None,None,None))[0]} → {ev.get('candidate',(None,None,None))[0]}",f"{ev.get('parent',(None,None,None))[1]} → {ev.get('candidate',(None,None,None))[1]}",m["selected_checkpoint_sha256"])
                  f.write(f"| {lane} | {vals[0]} | {vals[1]} → {vals[2]} | {vals[3]} → {vals[4]} | {vals[5]} | {vals[6]} | {vals[7]} |\n")
          print("Indexed",len(rows),"completed lane reports")
          PY
      - name: Preserve exact bundle as a draft release
        run: |
          set -euo pipefail
          tag="forge-best-lane-followup-42480865448"
          tar -czf "$tag.tar.gz" -C bundle .
          printf '%s\n' "Completed bounded continuations of Forge language, Blender, and Godot research branches. All jobs restored the verified parent and resumed optimizer/RNG state; isolated data and candidate weights remained separate. Parent/candidate evaluations and exact artifacts included. Research only: no Android promotion or capability claim." > notes.md
          gh release create "$tag" "$tag.tar.gz" --repo "$GITHUB_REPOSITORY" --draft --prerelease --title "Forge best-lane continuation — run 42480865448" --notes-file notes.md
