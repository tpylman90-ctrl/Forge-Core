name: Forge Seed v0.7 — pinned corpus and scratch tokenizer

on:
  workflow_dispatch:
    inputs:
      steps:
        type: number
        description: "Bounded additional steps, 1–30000"
        required: true
        default: 14000
      resume_run_id:
        type: string
        description: "Optional prior successful v0.7 run to resume"
        required: false
  push:
    branches: [main]
    paths: ["experiments/requests/preschool-v07-expand-001.md"]

permissions:
  contents: read
  actions: read

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      STEPS: ${{ github.event_name == 'push' && '28000' || inputs.steps || '14000' }}
      RESUME_ID: ${{ inputs.resume_run_id || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install original BPE tokenizer implementation
        run: python -m pip install "tokenizers>=0.20,<0.23"
      - name: Install Forge Core
        run: python -m pip install --no-deps -e .
      - name: Validate bounded runtime options
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STEPS" =~ ^[0-9]+$ ]]
          (( STEPS >= 1 && STEPS <= 30000 ))
          if [[ -n "$RESUME_ID" ]]; then [[ "$RESUME_ID" =~ ^[0-9]+$ ]]; fi
      - name: Stream bounded public corpus at immutable upstream revision
        run: |
          python -m forge_core.neural.pinned_corpus --out data/preschool \
            --train-mib 50 --valid-mib 5
      - name: Restore prior research checkpoint, if requested
        if: ${{ env.RESUME_ID != '' }}
        shell: bash
        run: |
          mkdir -p previous
          gh run download "$RESUME_ID" --repo "$GITHUB_REPOSITORY" \
            --name forge-seed-v07-research --dir previous
          test -f previous/checkpoint.pt
      - name: Train original scratch neural model and its own BPE tokenizer
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          if [[ -n "$RESUME_ID" ]]; then ARGS+=(--resume previous/checkpoint.pt); fi
          python -m forge_core.neural.seed_v07 \
            --source data/preschool --out artifacts/preschool \
            --model-size seed --steps "$STEPS" --batch 4 --seq-len 128 \
            --vocab 2048 --eval-every 2000 --seed 43 \
            "${ARGS[@]}"
      - name: Evaluate basic preschool-like capabilities without automatic promotion
        run: |
          cp data/preschool/manifest.json artifacts/preschool/source-manifest.json
          python -m forge_core.neural.preschool_eval \
            --checkpoint-dir artifacts/preschool \
            --out artifacts/preschool/capabilities.json
      - name: Preserve public text source, pinned revision and research checkpoint
        shell: bash
        run: |
          cp data/preschool/manifest.json artifacts/preschool/source-manifest.json
          cp data/preschool/train.txt artifacts/preschool/train.txt
          cp data/preschool/valid.txt artifacts/preschool/valid.txt
          printf '%s\n' \
            'TinyStories by Ronen Eldan and Yuanzhi Li (source: https://huggingface.co/datasets/roneneldan/TinyStories)' \
            'Declared license: CDLA-Sharing-1.0. Revision pinned in source-manifest.json.' \
            'Public synthetic story data only; NO personal memory or phone observations.' \
            'Sampled prefix of full train/validation source. Do not confuse with full corpus.' \
            > artifacts/preschool/SOURCE-NOTICE.txt
      - name: Upload reproducible experimental checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: forge-seed-v07-research
          path: artifacts/preschool/
          retention-days: 30
          if-no-files-found: error
