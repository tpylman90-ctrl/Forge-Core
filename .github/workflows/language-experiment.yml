name: Forge Scratch Language Experiment

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Approved real public text or synthetic CI control"
        required: true
        type: choice
        options: [tinystories, demo]
        default: tinystories
      model_size:
        description: "Tiny regression control; CPU-friendly Forge Seed; full original base"
        required: true
        type: choice
        options: [tiny, seed, base]
        default: seed
      steps:
        description: "ADDITIONAL steps (tiny <=500; seed <=2000; base <=5)"
        required: true
        type: number
        default: 1000
      resume_run_id:
        description: "Optional prior successful run ID with identical dataset and configuration"
        required: false
        type: string
  # One intentionally requested longer-run experiment; no automatic schedule.
  push:
    branches: [main]
    paths: ["experiments/requests/seed-run003.md"]

permissions:
  contents: read
  actions: read

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      DATASET: ${{ inputs.dataset || 'tinystories' }}
      MODEL_SIZE: ${{ inputs.model_size || 'seed' }}
      STEPS: ${{ inputs.steps || '1000' }}
      RESUME_RUN_ID: ${{ github.event_name == 'push' && '41554336734' || inputs.resume_run_id || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Forge Core
        run: python -m pip install --no-deps -e .
      - name: Verify bounded training request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DATASET" == demo || "$DATASET" == tinystories ]]
          [[ "$MODEL_SIZE" == tiny || "$MODEL_SIZE" == seed || "$MODEL_SIZE" == base ]]
          [[ "$STEPS" =~ ^[0-9]+$ ]]
          (( STEPS >= 1 ))
          if [[ "$MODEL_SIZE" == tiny ]]; then (( STEPS <= 500 )); fi
          if [[ "$MODEL_SIZE" == seed ]]; then (( STEPS <= 2000 )); fi
          if [[ "$MODEL_SIZE" == base ]]; then (( STEPS <= 5 )); fi
          if [[ -n "$RESUME_RUN_ID" ]]; then [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]; fi
      - name: Prepare document-separated language data
        run: |
          python -m forge_core.neural.prepare \
            --source "$DATASET" --out data/experiment --train-rows 200 --valid-rows 50
      - name: Verify exact public corpus content before any training
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DATASET" == tinystories ]]; then
            python -m forge_core.neural.lock \
              --manifest data/experiment/manifest.json \
              --lock data/locks/tinystories-preview-200-50-v0.4.json
          fi
      - name: Download prior approved experiment checkpoint
        if: ${{ env.RESUME_RUN_ID != '' }}
        shell: bash
        run: |
          mkdir -p previous
          gh run download "$RESUME_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name forge-scratch-language-checkpoint \
            --dir previous
          test -f previous/checkpoint.pt
      - name: Train from random weights or resume, then evaluate
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          if [[ -n "$RESUME_RUN_ID" ]]; then ARGS+=(--resume previous/checkpoint.pt); fi
          python -m forge_core.neural.experiment \
            --train data/experiment/train.txt \
            --valid data/experiment/valid.txt \
            --manifest data/experiment/manifest.json \
            --model-size "$MODEL_SIZE" --steps "$STEPS" \
            --batch-size 2 --seq-len 64 --eval-batches 8 \
            --sample-tokens 96 --seed 42 \
            --eval-every 100 --audit-batches 64 \
            --out artifacts/checkpoint.pt --report artifacts/metrics.json \
            "${ARGS[@]}"
      - name: Preserve exact public corpus, provenance and loss curve
        shell: bash
        run: |
          cp data/experiment/manifest.json artifacts/dataset-manifest.json
          cp data/experiment/train.txt artifacts/train.txt
          cp data/experiment/valid.txt artifacts/valid.txt
          if [[ "$DATASET" == tinystories ]]; then
            printf '%s\n' 'Public TinyStories preview: roneneldan/TinyStories (CDLA-Sharing-1.0)' 'https://huggingface.co/datasets/roneneldan/TinyStories' 'Content SHA256 pinned to Forge Seed Run 002; this is not an immutable full upstream dataset snapshot.' > artifacts/SOURCE-NOTICE.txt
          else
            printf '%s\n' 'Forge Core original synthetic CI test fixtures; not a real language corpus.' > artifacts/SOURCE-NOTICE.txt
          fi
      - name: Retain checkpoint, optimizer, validation and generated sample
        uses: actions/upload-artifact@v4
        with:
          name: forge-scratch-language-checkpoint
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
