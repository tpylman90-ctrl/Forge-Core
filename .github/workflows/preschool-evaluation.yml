name: Forge Seed v0.7 — preschool capability audit

on:
  workflow_dispatch:
    inputs:
      training_run_id:
        type: string
        description: "Completed Forge Seed v0.7 scratch-language run"
        required: true
        default: "41572257363"
  push:
    branches: [main]
    paths: ["experiments/requests/preschool-v07-benchmark.md"]

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUN_ID: ${{ github.event_name == 'push' && '41572257363' || inputs.training_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Scratch BPE codec
        run: python -m pip install "tokenizers>=0.20,<0.23"
      - name: Install Forge Core
        run: python -m pip install --no-deps -e .
      - name: Fetch completed, public-only research checkpoint
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          mkdir -p checkpoint results
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name forge-seed-v07-research --dir checkpoint
          test -f checkpoint/checkpoint.pt
          test -f checkpoint/source-manifest.json
          test -f checkpoint/tokenizer.json
      - name: Run held-out preschool capability probes
        shell: bash
        run: |
          python -m forge_core.neural.preschool_eval \
            --checkpoint-dir checkpoint \
            --out results/capabilities.json
      - name: Preserve skills audit and unreviewed manual language examples
        uses: actions/upload-artifact@v4
        with:
          name: forge-seed-v07-preschool-capabilities
          path: results/
          if-no-files-found: error
          retention-days: 30
