name: Visual reference sheet contract

on:
  pull_request:
    paths:
      - "scripts/kaggle_reference_sheet_benchmark.py"
      - "tests/test_reference_sheet_benchmark.py"
      - "prompts/REFERENCE-SHEET-VISION-V1.md"
      - ".github/workflows/visual-reference-contract.yml"
  push:
    branches: [main]
    paths:
      - "scripts/kaggle_reference_sheet_benchmark.py"
      - "tests/test_reference_sheet_benchmark.py"
      - "prompts/REFERENCE-SHEET-VISION-V1.md"
      - ".github/workflows/visual-reference-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install small CPU-only contract dependency
        run: python -m pip install pillow
      - name: Validate benchmark interfaces without private images or GPU
        run: |
          python -m py_compile scripts/kaggle_reference_sheet_benchmark.py
          python -m unittest discover -s tests -p 'test_reference_sheet_benchmark.py' -v
          python scripts/kaggle_reference_sheet_benchmark.py --help
