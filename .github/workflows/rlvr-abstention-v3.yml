name: Forge Seed — RLVR v3 rejection and distribution shift

on:
  workflow_dispatch:
    inputs:
      updates:
        description: "Updates per arm and seed (10–160), CPU only"
        required: true
        type: number
        default: 80
      seeds:
        description: "Independent random seeds (1 or 2)"
        required: true
        type: choice
        options: ["1", "2"]
        default: "2"
  push:
    branches: [main]
    paths:
      - "experiments/requests/rlvr-abstention-v3-001.md"

concurrency:
  group: forge-rlvr-proof-pilot-cpu
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-learn:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UPDATES: ${{ inputs.updates || '80' }}
      SEEDS: ${{ inputs.seeds || '2' }}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Forge Core research package
        run: python -m pip install --no-deps -e .
      - name: Validate bounded budgets and no-valid proof oracles
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UPDATES" =~ ^[0-9]+$ ]]
          [[ "$SEEDS" =~ ^[12]$ ]]
          (( UPDATES >= 10 && UPDATES <= 160 ))
          python -m unittest discover -s tests -p test_rlvr_abstention_v3.py -v
      - name: Record runner start and resources
        run: |
          mkdir -p results
          date -u '+%Y-%m-%dT%H:%M:%SZ' > results/start-time.txt
          getconf _NPROCESSORS_ONLN > results/logical-cpus.txt
          free -m > results/memory.txt
      - name: Train matched RLVR arms and evaluate safe rejection on new tasks
        shell: bash
        run: |
          set -euo pipefail
          python -m forge_core.neural.rlvr_abstention_v3 \
            --out results --updates "$UPDATES" --seeds "$SEEDS"
      - name: Record runner end
        if: always()
        run: date -u '+%Y-%m-%dT%H:%M:%SZ' > results/end-time.txt
      - name: Preserve metrics and isolated research-only checkpoint states
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-rlvr-v3-abstention-research
          path: results/
          if-no-files-found: warn
          retention-days: 30
