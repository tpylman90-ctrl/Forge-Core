name: Forge Seed — verifiable process RLVR pilot

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Small pilot policy updates per training arm (10–200)"
        required: true
        type: number
        default: 80
  push:
    branches: [main]
    paths:
      - "experiments/requests/rlvr-process-v1-001.md"

concurrency:
  group: forge-rlvr-proof-pilot-cpu
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-train:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STEPS: ${{ inputs.steps || '80' }}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Forge from public repository
        run: python -m pip install --no-deps -e .
      - name: Verify bounded experiment and formal safety gates
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STEPS" =~ ^[0-9]+$ ]]
          (( STEPS >= 10 && STEPS <= 200 ))
          python -m unittest discover -s tests -p test_rlvr_process_v1.py -v
      - name: Record runner metadata
        run: |
          mkdir -p results
          date -u +%Y-%m-%dT%H:%M:%SZ > results/start-time.txt
          getconf _NPROCESSORS_ONLN > results/available-cpus.txt
      - name: Compare equal-budget sampled RLVR and process-supervision arms
        run: |
          python -m forge_core.neural.rlvr_process_v1 \
            --seed 104 --steps "$STEPS" --out results
      - name: Record end timestamp
        if: always()
        run: date -u +%Y-%m-%dT%H:%M:%SZ > results/end-time.txt
      - name: Preserve verifiable proof metrics as research only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-rlvr-verifiable-process-v1
          path: results/
          if-no-files-found: warn
          retention-days: 30
