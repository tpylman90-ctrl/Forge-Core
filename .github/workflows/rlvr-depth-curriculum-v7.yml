name: Forge Seed — verified depth curriculum v7

on:
  workflow_dispatch:
    inputs:
      updates:
        type: number
        required: true
        default: 900
        description: "Single-run updates per seed and arm (10–1200)"
      seeds:
        type: choice
        required: true
        default: "2"
        options: ["1", "2"]
  push:
    branches: [main]
    paths:
      - "experiments/requests/rlvr-depth-curriculum-v7-001.md"

concurrency:
  group: forge-rlvr-proof-pilot-cpu
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staged-proof-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UPDATES: ${{ inputs.updates || '900' }}
      SEEDS: ${{ inputs.seeds || '2' }}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original-weight CPU research dependencies
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install public Forge research source
        run: python -m pip install --no-deps -e .
      - name: Check original formal oracle, proof depths and bounded CPU budget
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UPDATES" =~ ^[0-9]+$ ]]
          [[ "$SEEDS" =~ ^[12]$ ]]
          (( UPDATES >= 10 && UPDATES <= 1200 ))
          python -m unittest discover -s tests -p test_rlvr_proof_generator_v5.py -v
          python -m unittest discover -s tests -p test_rlvr_verified_traces_v6.py -v
          python -m unittest discover -s tests -p test_rlvr_depth_curriculum_v7.py -v
      - name: Record CPU environment and experiment start
        run: |
          mkdir -p results
          date -u '+%Y-%m-%dT%H:%M:%SZ' > results/start-utc.txt
          getconf _NPROCESSORS_ONLN > results/cpu-count.txt
      - name: Train identical new policies with flat vs 1-to-3-step verified curricula
        shell: bash
        run: |
          set -euo pipefail
          python -m forge_core.neural.rlvr_depth_curriculum_v7 \
            --out results --updates "$UPDATES" --seeds "$SEEDS"
      - name: Record training end
        if: always()
        run: date -u '+%Y-%m-%dT%H:%M:%SZ' > results/end-utc.txt
      - name: Save temporary experimental weights and independent exam metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-rlvr-depth-curriculum-v7-research
          path: results/
          if-no-files-found: warn
          retention-days: 30
