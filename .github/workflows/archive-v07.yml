name: Forge Seed v0.7 — audited draft research archive

on:
  workflow_dispatch:
    inputs:
      research_run_id:
        type: string
        description: "Successful, public-only Forge Seed v0.7 pretraining run"
        required: true
      release_tag:
        type: string
        description: "New versioned unique draft research tag"
        required: true
      confirmation:
        type: choice
        description: "Authorize unpublished draft archive of PUBLIC source data"
        required: true
        options: [do-not-create, approve-public-research-draft]
        default: do-not-create
  push:
    branches: [main]
    paths: ["experiments/requests/archive-v07-001.md"]

permissions:
  contents: write
  actions: read

jobs:
  archive:
    if: ${{ github.event_name == 'push' || inputs.confirmation == 'approve-public-research-draft' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUN_ID: ${{ github.event_name == 'push' && '41572257363' || inputs.research_run_id }}
      RELEASE_TAG: ${{ github.event_name == 'push' && 'forge-seed-v07-pretrain-14000' || inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install train-only BPE decoder
        run: python -m pip install "tokenizers>=0.20,<0.23"
      - name: Install Forge Core
        run: python -m pip install --no-deps -e .
      - name: Validate source and unique tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^forge-seed-v07-[a-zA-Z0-9._-]+$ ]]
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: refusing overwrite" >&2
            exit 1
          fi
      - name: Download research artifact and audit source, weights and tokenizer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name forge-seed-v07-research --dir artifact
          python -m forge_core.neural.archive_v07 --folder artifact
      - name: Create DRAFT research archive only
        shell: bash
        run: |
          set -euo pipefail
          cat > artifact/RELEASE-NOTES.md <<EOF
          Experimental Forge Seed v0.7, public-data research ONLY.
          Source training run: $RUN_ID.
          Scratch-initialized 2.2M-parameter model and scratch BPE tokenizer.
          Small revision-pinned source prefix from roneneldan/TinyStories,
          declared CDLA-Sharing-1.0, with attribution and full SHA256 audit.
          The source is synthetic public story text. No personal memories.
          This DRAFT is not a functioning general-purpose or preschool AI.
          Review training metrics and independent capability assessment.
          This is NOT publicly released unless separately approved.
          EOF
          gh release create "$RELEASE_TAG" \
            artifact/checkpoint.pt artifact/tokenizer.json \
            artifact/metrics.json artifact/source-manifest.json \
            artifact/train.txt artifact/valid.txt \
            artifact/SOURCE-NOTICE.txt artifact/archive-integrity.json \
            --title "Forge Seed v0.7 (unpublished research)" \
            --notes-file artifact/RELEASE-NOTES.md --draft
