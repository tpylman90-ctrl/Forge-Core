name: Forge Seed — pure dialogue bootstrap v1

on:
  workflow_dispatch:
    inputs:
      steps:
        type: number
        required: true
        default: 160
        description: "Matched CPU updates per arm (20–500)"
  push:
    branches: [main]
    paths:
      - "experiments/requests/dialogue-bootstrap-v1-*.md"

concurrency:
  group: forge-seed-pure-dialogue-bootstrap-v1
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  dialogue-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      STEPS: ${{ inputs.steps || '160' }}
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and pinned tokenizer runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "tokenizers>=0.20,<0.23"
          python -m pip install --no-deps -e .
      - name: Check bounded experiment settings
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STEPS" =~ ^[0-9]+$ ]]
          (( STEPS >= 20 && STEPS <= 500 ))
      - name: Retrieve source-verified original Forge Seed v0.7 lineage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original results
          gh run download 42552572467 --repo "$GITHUB_REPOSITORY" \
            --name forge-language-followup-107k-42552572467 --dir restore
          test -f restore/language/checkpoint.pt
          cp -R restore/language/. original/
          test -f original/checkpoint.pt
          test -f original/tokenizer.json
          test -f original/source-manifest.json
          test -f original/train.txt
          test -f original/valid.txt
      - name: Replicate matched training across two CPU seeds
        run: |
          set -euo pipefail
          for seed in 53 73; do
            python -m forge_core.neural.dialogue_bootstrap_v1 \
              --source original --out "results/seed-$seed" --steps "$STEPS" --seed "$seed"
          done
      - name: Summarize replication gates
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reports = []
          for path in sorted(Path("results").glob("seed-*/report.json")):
              report = json.loads(path.read_text())
              gate = report["dialogue_improvement_gate"]
              reports.append({
                  "seed": int(path.parent.name.removeprefix("seed-")),
                  "correct": gate["correct_arm_macro_accuracy"],
                  "control": gate["shuffled_control_macro_accuracy"],
                  "parent": gate["frozen_parent_macro_accuracy"],
                  "retention_delta": gate["tiny_stories_validation_loss_delta"],
                  "passed": gate["passed"],
              })
          summary = {
              "replications": reports,
              "all_available_seeds_passed": bool(reports) and all(r["passed"] for r in reports),
              "interpretation": "Two additional seeds test whether the first pilot's narrow synthetic response-ranking gain repeats; no candidate is promoted."
          }
          Path("results/replication-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PY
      - name: Preserve unpromoted candidates and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-seed-pure-dialogue-bootstrap-v1
          path: results/
          retention-days: 30
          if-no-files-found: warn

      - name: Preserve every produced candidate in a durable draft release
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! find results -name '*.pt' -print -quit | grep -q .; then
            echo "No candidate checkpoints were produced."
            exit 0
          fi
          tag="forge-dialogue-bootstrap-${GITHUB_RUN_ID}"
          tar -czf "artifacts/${tag}.tar.gz" -C results .
          cat > release-notes.md <<'EOF'
          Research-only Forge Seed dialogue bootstrap candidates and their
          reports. These weights are preserved for review and lineage tracking.
          A passing narrow synthetic gate does not certify open-ended dialogue.
          Rejected or regressed candidates are retained for comparison.
          No base checkpoint or Android model is modified.
          EOF
          gh release create "${tag}" "artifacts/${tag}.tar.gz" \
            --repo "${GITHUB_REPOSITORY}" --draft --prerelease \
            --title "Forge dialogue bootstrap candidates ${GITHUB_RUN_ID}" \
            --notes-file release-notes.md
