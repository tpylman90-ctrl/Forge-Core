[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-core-ai"
version = "0.1.0"
description = "Forge Core independent personal AI research scaffold"
requires-python = ">=3.10"
dependencies = ["torch>=2.3,<3"]

[tool.setuptools.packages.find]
where = ["src"]
